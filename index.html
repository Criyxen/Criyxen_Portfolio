<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criyxen | Access Gate</title>
    <link rel="icon" type="image/png" href="02_character_and_cat_pack/6.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('user_role')) {
            window.location.replace('pages/home.html');
        }
    </script>
</head>
<body class="auth-body">

    <div class="split-auth-card">
        <!-- Left Welcome & Geometric Accent Panel -->
        <div class="auth-left-panel">
            <div class="geo-shapes-top">
                <div class="geo-bar gb-1"></div>
                <div class="geo-bar gb-2"></div>
                <div class="geo-line gl-1"></div>
                <div class="geo-line gl-2"></div>
            </div>

            <div class="auth-left-content">
                <span class="auth-brand-tag">CRIYXEN PORTAL</span>
                <div class="auth-greeting">
                    <span>Welcome to</span>
                    <strong>Criyxen</strong>
                    <span class="highlight-day">DIGITAL VAULT</span>
                </div>
                <p class="auth-sub-note">
                    Michael D. Ebin Jr. • BSEMC-DAT Animation, Art & Interactive Portfolio.
                </p>
            </div>

            <div class="geo-shapes-bottom">
                <div class="geo-bar gb-3"></div>
                <div class="geo-bar gb-4"></div>
                <div class="geo-line gl-3"></div>
            </div>
        </div>

        <!-- Right Login / Sign Up Panel -->
        <div class="auth-right-panel">
            <div class="geo-corner-accent">
                <div class="corner-block cb-1"></div>
                <div class="corner-block cb-2"></div>
            </div>

            <div class="auth-form-wrapper">
                <h2 class="auth-form-title" id="auth-panel-heading">Login</h2>

                <div id="error-message" class="auth-error-msg"></div>

                <!-- 1. Unified Login Form (Member & Creator Admin) -->
                <form id="unified-login-form">
                    <div class="form-group">
                        <label for="unified-user">Username</label>
                        <input type="text" id="unified-user" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="unified-pass">Password</label>
                        <input type="password" id="unified-pass" placeholder="Enter password" required>
                    </div>
                    <div class="forgot-pass-row">
                        <a href="#" id="forgot-pass-link">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-neon btn-crimson auth-submit-btn">LOGIN</button>
                </form>

                <!-- 2. Member Sign Up Form -->
                <form id="unified-signup-form" style="display: none;">
                    <div class="form-group">
                        <label for="gate-reg-user">Create Username</label>
                        <input type="text" id="gate-reg-user" placeholder="Choose unique username" required>
                    </div>
                    <div class="form-group">
                        <label for="gate-reg-email">Email Address</label>
                        <input type="email" id="gate-reg-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="gate-reg-pass">Create Password</label>
                        <input type="password" id="gate-reg-pass" placeholder="Create password" required>
                    </div>
                    <button type="submit" class="btn-neon btn-crimson auth-submit-btn">CREATE ACCOUNT</button>
                </form>

                <div class="guest-divider"><span>OR BROWSE AS VISITOR</span></div>

                <button type="button" id="guest-btn" class="btn-neon auth-guest-btn">
                    <i class="fas fa-eye"></i> ENTER AS GUEST
                </button>
            </div>

            <div class="auth-bottom-switch">
                <p id="switch-to-signup-text">Don't have an account? <a href="#" id="show-signup-link">Sign Up</a></p>
                <p id="switch-to-login-text" style="display: none;">Already have an account? <a href="#" id="show-login-link">Login</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
